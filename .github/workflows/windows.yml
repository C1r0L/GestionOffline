name: Validar y empaquetar Windows
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Compilar, probar y crear instalador
        shell: pwsh
        run: ./packaging/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MiPOS-Windows-x64
          path: artifacts/installer/*.exe
          if-no-files-found: error
